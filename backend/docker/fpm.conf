[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
ping.path = /ping
ping.response = pong
; Sem log de acesso no FPM (o Nginx já registra); nada de corpo de requisição em log.
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
