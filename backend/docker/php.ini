; Configuração PHP do Comando (produção e desenvolvimento)
expose_php = Off
memory_limit = 256M
max_execution_time = 60
date.timezone = UTC

; Anexos: 10 MB por arquivo (validados pela aplicação), até 5 por envio.
; Os limites do PHP ficam um pouco acima para que a aplicação devolva
; mensagens de validação claras em vez de descartar o arquivo.
upload_max_filesize = 12M
post_max_size = 64M
max_file_uploads = 20

; Logs no stderr do container
log_errors = On
display_errors = Off
error_log = /proc/self/fd/2

session.cookie_httponly = 1
session.use_strict_mode = 1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
