# Nginx do serviço "web": entrega o frontend compilado e encaminha a API ao
# PHP-FPM do serviço "backend" (rede interna). Frontend e API no mesmo endereço.

map $http_x_forwarded_proto $comando_https {
    default "";
    https   on;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 5 anexos de até 10 MB + campos do formulário.
    client_max_body_size 64m;

    # DNS interno do Docker: resolve "backend" a cada requisição, permitindo
    # que o backend seja recriado sem reiniciar o Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_fpm backend:9000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API Laravel, cookie CSRF do Sanctum e verificação de saúde.
    location ~ ^/(api|sanctum)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS $comando_https if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $backend_fpm;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_hide_header X-Powered-By;
    }

    # Atalho para a verificação de saúde da aplicação (equivale a /api/v1/health).
    location = /health {
        include fastcgi_params;
        fastcgi_param REQUEST_URI /api/v1/health;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $backend_fpm;
        access_log off;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /docs/ {
        try_files $uri $uri/index.html =404;
    }

    # Aplicação React (React Router): qualquer outra rota cai no index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
